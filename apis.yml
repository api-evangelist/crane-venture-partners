name: Crane Venture Partners
description: >-
  Crane Venture Partners is an early-stage venture capital firm founded in 2015 by Krishna Visvanathan and Scott Sage
  that backs outlier founders everywhere, from inception to seed, building the foundational technologies that shape the
  future: AI infrastructure, semiconductors, developer innovations, enterprise systems, data infrastructure, security and
  hard tech. Originally London-based and focused on European enterprise founders, Crane describes itself as one firm
  "global by design" with offices in London, San Francisco, New York, Singapore and Bangalore. Its published portfolio
  of 115 companies includes Encord, Ona (acquired by OpenAI), Tessian (acquired by Proofpoint), Qure.ai, Zluri and TestSigma.
